<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z70 Catalog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:22px 18px 16px;border-bottom:1px solid #292a2e;display:flex;justify-content:space-between;align-items:center}header h1{font-size:22px;letter-spacing:1px;margin:0}header small{color:#999}.layout{display:flex;min-height:calc(100vh - 70px)}aside{width:190px;padding:18px;border-left:1px solid #292a2e}aside button{display:block;width:100%;text-align:right;margin:5px 0;padding:12px;background:transparent;color:#bbb;border:0;border-radius:9px;cursor:pointer}aside button.active,aside button:hover{background:#25262a;color:#fff}main{flex:1;padding:22px;min-width:0}.search{width:100%;padding:13px;border-radius:12px;background:#1d1e21;border:1px solid #34353a;color:white;margin-bottom:20px}.section-title{margin:0 0 15px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.card{background:#1d1e21;border:1px solid #2d2e32;border-radius:14px;overflow:hidden}.cover{height:190px;background:linear-gradient(145deg,#555,#26272a);display:flex;align-items:center;justify-content:center;color:#ddd;font-size:20px;font-weight:700;letter-spacing:2px}.info{padding:12px}.info h3{margin:0 0 7px;font-size:15px}.info p{margin:0;color:#9b9ca2;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tabs button{border:1px solid #34353a;background:#202125;color:#ddd;padding:8px 12px;border-radius:20px;cursor:pointer}.tabs button.active{background:#e1e1e1;color:#111}.empty{color:#aaa;padding:20px 0}@media(max-width:600px){aside{width:125px;padding:10px}main{padding:14px}header{padding:16px}.cover{height:155px}.grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}}
</style>
</head><body>
<header><div><h1>Z70 CATALOG</h1><small>Personal media library</small></div><small>Preview</small></header>
<div class="layout"><aside><button class="active" data-cat="All">⌂ الرئيسية</button><button data-cat="Anime">Anime</button><button data-cat="Movies & Series">Movies & Series</button><button data-cat="Manga & Manhwa">Manga & Manhwa</button><button data-cat="Favorites">Favorites</button><button data-cat="My Library">My Library</button></aside>
<main><input id="search" class="search" placeholder="ابحث عن عنوان…"><div class="tabs"><button class="active" data-cat="All">الكل</button><button data-cat="Anime">Anime</button><button data-cat="Movies & Series">Movies & Series</button><button data-cat="Manga & Manhwa">Manga & Manhwa</button></div><h2 class="section-title">المكتبة</h2><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>لا توجد نتائج. جرّب البحث بكلمة أخرى.</div></main></div>
<script>
const items=[{name:'Sample Anime',cat:'Anime',desc:'نموذج تجريبي'},{name:'Sample Film',cat:'Movies & Series',desc:'نموذج تجريبي'},{name:'Sample Series',cat:'Movies & Series',desc:'نموذج تجريبي'},{name:'Sample Manga',cat:'Manga & Manhwa',desc:'نموذج تجريبي'},{name:'Sample Manhwa',cat:'Manga & Manhwa',desc:'نموذج تجريبي'}];let category='All';const grid=document.getElementById('grid'),search=document.getElementById('search');function draw(){let filtered=items.filter(x=>(category==='All'||category==='My Library'||category==='Favorites'||x.cat===category)&&x.name.toLowerCase().includes(search.value.toLowerCase()));grid.innerHTML=filtered.map(x=>`<article class="card"><div class="cover">Z70</div><div class="info"><h3>${x.name}</h3><p>${x.cat} · ${x.desc}</p></div></article>`).join('');document.getElementById('empty').hidden=filtered.length>0}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));draw()});search.oninput=draw;draw();
</script></body></html>
