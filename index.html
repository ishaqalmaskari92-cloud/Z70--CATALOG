<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z70 Catalog</title>
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.0.0/dist/index.js"></script>
    <style>
        :root {
            --bg-deep: #121212;
            --bg-card: #1f1f1f;
            --accent-grey: #333333;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #00ffcc55; /* Cyber touch */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--bg-card);
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent-grey);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background-color: #181818;
            overflow-x: auto;
        }
        nav button {
            background-color: var(--accent-grey);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        nav button.active {
            background-color: var(--text-main);
            color: var(--bg-deep);
            font-weight: bold;
        }
        .search-container {
            padding: 20px;
            text-align: center;
        }
        #searchBar {
            width: 80%;
            max-width: 500px;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid var(--accent-grey);
            background-color: var(--bg-card);
            color: var(--text-main);
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--accent-grey);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-info {
            padding: 10px;
        }
        .card-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <h1>Z70 Catalog</h1>
</header>

<nav>
    <button class="active" onclick="filterCategory('all')">الكل</button>
    <button onclick="filterCategory('anime')">Anime</button>
    <button onclick="filterCategory('movies')">Movies & Series</button>
    <button onclick="filterCategory('manga')">Manga & Manhwa</button>
    <button onclick="filterCategory('library')">My Library</button>
    <button onclick="filterCategory('favorites')">Favorites</button>
</nav>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="ابحث في الكتالوج..." onkeyup="searchCatalog()">
</div>

<div class="catalog-grid" id="catalogGrid">
    <!-- Dummy Data -->
    <div class="card" data-category="anime" data-title="Attack on Titan">
        <img src="https://via.placeholder.com/150x220?text=AoT" alt="Anime">
        <div class="card-info">
            <div class="card-title">Attack on Titan</div>
            <div class="card-meta">Anime • 9.0/10</div>
        </div>
    </div>
    <div class="card" data-category="movies" data-title="Breaking Bad">
        <img src="https://via.placeholder.com/150x220?text=Breaking+Bad" alt="Series">
        <div class="card-info">
            <div class="card-title">Breaking Bad</div>
            <div class="card-meta">Series • 9.5/10</div>
        </div>
    </div>
    <div class="card" data-category="manga" data-title="Solo Leveling">
        <img src="https://via.placeholder.com/150x220?text=Solo+Leveling" alt="Manga">
        <div class="card-info">
            <div class="card-title">Solo Leveling</div>
            <div class="card-meta">Manga • 8.8/10</div>
        </div>
    </div>
</div>

<script>
    // Initialize Discord SDK (Simple placeholder logic for now)
    console.log("Discord Embedded App SDK loaded");

    function filterCategory(category) {
        document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            if (category === 'all' || card.dataset.category === category) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function searchCatalog() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const title = card.dataset.title.toLowerCase();
            if (title.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>

</body>
          </html>
